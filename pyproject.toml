[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dc-motor-elastic-load"
version = "0.1.0"
description = "DC motor with elastic shaft and load simulation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "matplotlib>=3.8",
  "pandas>=2.1",
]

[tool.setuptools.packages.find]
where = ["src"]

